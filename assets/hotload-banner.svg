<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">HotLoad</title>
  <desc id="desc">An experimental title-screen mod activation project for Probably Stolen.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110f"/>
      <stop offset=".52" stop-color="#10251d"/>
      <stop offset="1" stop-color="#21190d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f7d080"/>
      <stop offset="1" stop-color="#ff8a5b"/>
    </linearGradient>
    <radialGradient id="lamp">
      <stop offset="0" stop-color="#ffd27a" stop-opacity=".8"/>
      <stop offset="1" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#9ee7c1" opacity=".13"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <style>
      .kicker { font: 700 15px "Segoe UI", Arial, sans-serif; letter-spacing: 2.2px; }
      .title { font: 900 82px "Segoe UI", Arial, sans-serif; letter-spacing: -3px; }
      .cn { font: 700 30px "Microsoft YaHei", "Segoe UI", sans-serif; }
      .en { font: 500 19px "Segoe UI", Arial, sans-serif; }
      .mono { font: 600 14px Consolas, monospace; }
      .label { font: 700 13px "Segoe UI", Arial, sans-serif; letter-spacing: 1.2px; }
    </style>
  </defs>

  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect x="15" y="15" width="1250" height="330" rx="22" fill="none" stroke="#e2c57c" stroke-opacity=".22"/>
  <rect x="15" y="15" width="1250" height="330" rx="22" fill="url(#grid)"/>
  <circle cx="1055" cy="102" r="220" fill="url(#lamp)" filter="url(#blur)"/>
  <circle cx="1210" cy="320" r="180" fill="#42d6a4" opacity=".08" filter="url(#blur)"/>

  <g transform="translate(56 48)">
    <rect width="240" height="32" rx="16" fill="#0a1512" stroke="#66d8ab" stroke-opacity=".42"/>
    <circle cx="18" cy="16" r="5" fill="#f6c65b"/>
    <text x="33" y="21" class="kicker" fill="#b6ebd3">UNOFFICIAL · EXPERIMENTAL</text>
  </g>

  <text x="55" y="161" class="title" fill="#f8f1df">HOTLOAD</text>
  <text x="59" y="207" class="cn" fill="#f2c66e">标题页免重启激活 MOD</text>
  <text x="60" y="240" class="en" fill="#a9c5b7">Native approval retained. External bootstrap disclosed.</text>

  <g transform="translate(56 276)">
    <rect width="454" height="45" rx="12" fill="#08120f" stroke="#27453a"/>
    <text x="18" y="28" class="mono" fill="#7fdbb4">mode=active</text>
    <text x="145" y="28" class="mono" fill="#546f63">│</text>
    <text x="166" y="28" class="mono" fill="#f4ca75">allow=ID|version|fingerprint</text>
  </g>

  <g transform="translate(638 66)">
    <rect width="578" height="231" rx="22" fill="#07110e" fill-opacity=".82" stroke="#426555"/>
    <rect x="1" y="1" width="576" height="38" rx="21" fill="#13231d" stroke="#426555"/>
    <circle cx="24" cy="20" r="5" fill="#f18d72"/>
    <circle cx="42" cy="20" r="5" fill="#f2ca6d"/>
    <circle cx="60" cy="20" r="5" fill="#71d5a7"/>
    <text x="434" y="25" class="mono" fill="#6e9281">TITLE MENU</text>

    <rect x="28" y="64" width="310" height="135" rx="16" fill="#0c1a15" stroke="#2a4a3c"/>
    <text x="50" y="92" class="label" fill="#799889">INSTALLED MODS</text>
    <rect x="48" y="109" width="270" height="34" rx="9" fill="#102a21" stroke="#2d6b52"/>
    <circle cx="68" cy="126" r="7" fill="#61d596"/>
    <text x="86" y="131" class="mono" fill="#d8ecdf">Reputation Pop</text>
    <rect x="274" y="115" width="26" height="14" rx="7" fill="#5bd09a"/>
    <circle cx="294" cy="122" r="5" fill="#08120f"/>
    <rect x="48" y="151" width="270" height="34" rx="9" fill="#111915" stroke="#29372f"/>
    <circle cx="68" cy="168" r="7" fill="#5e6f65"/>
    <text x="86" y="173" class="mono" fill="#8fa398">ShutterEvents</text>
    <rect x="274" y="157" width="26" height="14" rx="7" fill="#405049"/>
    <circle cx="280" cy="164" r="5" fill="#b9c8bf"/>

    <path d="M362 131 H398" stroke="#d2b365" stroke-width="3" stroke-dasharray="7 6"/>
    <path d="M394 123 L404 131 L394 139" fill="none" stroke="#d2b365" stroke-width="3"/>
    <rect x="420" y="75" width="130" height="111" rx="16" fill="#19170f" stroke="#d5ad58"/>
    <path d="M446 106 l12 63 h51 l12-63Z" fill="#f0c56a" opacity=".18" stroke="#f0c56a"/>
    <path d="M457 103 h55 l-7-17 h-41Z" fill="#f0c56a" opacity=".52"/>
    <circle cx="485" cy="137" r="15" fill="#ffcb65" opacity=".85"/>
    <path d="M485 124 v26 M472 137 h26" stroke="#fff0bd" stroke-width="3"/>
    <text x="451" y="175" class="label" fill="#f5d183">HOT LOAD?</text>

    <path d="M37 218 H541" stroke="#29473a"/>
    <circle cx="44" cy="218" r="5" fill="#f4c765"/>
    <text x="58" y="223" class="mono" fill="#89a99a">approval = native · queue = main thread · result = verify in game</text>
  </g>

  <path d="M509 198 C562 187 585 196 638 183" fill="none" stroke="#f1c56a" stroke-width="3" stroke-dasharray="8 8" opacity=".72"/>
  <circle cx="638" cy="183" r="5" fill="#f1c56a"/>
</svg>
